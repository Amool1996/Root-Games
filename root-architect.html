<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Root Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(#87CEEB 0%,#b8e0f5 30%,#8B6F47 30.5%,#5C4327 100%); }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:20px; text-align:center;
    overflow-y:auto; }   /* never let a button end up below the fold with no way to reach it */
  .screen.on { display:flex; }
  h1 { font-size:min(9vw,64px); color:#fff; text-shadow:3px 3px 0 #3d2b15, -1px -1px 0 #3d2b15; }
  h2 { font-size:min(6vw,40px); color:#fff; text-shadow:2px 2px 0 #3d2b15; }
  .sub { font-size:min(4vw,24px); color:#fffbe8; text-shadow:1px 1px 2px #333; max-width:800px; }
  .bigbtn { font-size:min(6vw,34px); padding:16px 44px; border:none; border-radius:22px; cursor:pointer;
    background:linear-gradient(#7ec850,#4e9a2e); color:#fff; font-weight:bold;
    box-shadow:0 6px 0 #35691f; text-shadow:1px 1px 2px #2c5519; }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 2px 0 #35691f; }
  .bigbtn:disabled { filter:grayscale(.8); opacity:.6; }
  /* title screen */
  #s_title { padding:0; overflow:hidden; background:#080f28; }
  #heroImg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
    transform-origin:50% 100%; animation:sway 6s ease-in-out infinite; }
  #titleOverlay { position:relative; z-index:2; width:100%; height:100%; display:flex;
    flex-direction:column; align-items:center; justify-content:space-between; padding:4vh 16px 5vh; gap:10px; }
  .bigTitle { font-size:min(15vw,110px); font-weight:900; letter-spacing:3px; color:#fff; margin:0;
    text-shadow:0 3px 0 #0a2d0a, 0 0 22px rgba(120,220,90,.6), 3px 4px 6px #000;
    animation:titlePop .7s cubic-bezier(.2,1.5,.4,1) both, titleWiggle 3.2s ease-in-out 0.7s infinite; }
  .tagline { font-size:min(3.8vw,22px); color:#eafff0; margin:12px auto 0; max-width:640px;
    text-shadow:1px 1px 4px #000, 0 0 10px rgba(0,0,0,.7); line-height:1.4;
    animation:fadeUp .8s ease-out .4s both; }
  .titleBtns { display:flex; flex-direction:column; gap:14px; align-items:center; }
  .pulseWrap { animation:btnPulse 1.3s ease-in-out infinite; }
  #stage { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .char { position:absolute; width:min(15vw,96px); filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .char.big { width:min(22vw,140px); }
  .char svg { width:100%; height:auto; display:block; overflow:visible; }
  .act { transform-origin:50% 100%; }
  @keyframes wanderR { 0%{transform:translate(0,0)} 30%{transform:translate(8vw,-3vh)} 60%{transform:translate(15vw,2vh)} 100%{transform:translate(0,0)} }
  @keyframes wanderL { 0%{transform:translate(0,0)} 30%{transform:translate(-9vw,3vh)} 60%{transform:translate(-16vw,-3vh)} 100%{transform:translate(0,0)} }
  @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5vw,4vh)} }
  @keyframes crawl { 0%{transform:translateX(0) scaleX(1)} 47%{transform:translateX(36vw) scaleX(1)} 50%{transform:translateX(36vw) scaleX(-1)} 97%{transform:translateX(0) scaleX(-1)} 100%{transform:translateX(0) scaleX(1)} }
  @keyframes hop { 0%,100%{transform:translateY(0) scale(1,1)} 30%{transform:translateY(-34px) scale(.92,1.1)} 45%{transform:translateY(-38px) scale(.96,1.04)} 62%{transform:translateY(0) scale(1.2,.8)} 76%{transform:translateY(0) scale(.98,1.02)} }
  @keyframes ballBounce { 0%,100%{transform:translateY(0) scale(1,1)} 38%{transform:translateY(-28px) scale(.94,1.08)} 54%{transform:translateY(0) scale(1.16,.84)} 70%{transform:translateY(-9px) scale(1,1)} }
  @keyframes dance { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(10deg)} }
  @keyframes slurp { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-4px) rotate(2deg)} }
  @keyframes inch { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(.7)} }
  /* intro story */
  #s_intro { background:linear-gradient(#0b1533,#1a2c5e 40%,#2a1c10 41%,#120c06); justify-content:flex-start; padding-top:14px; gap:10px; overflow-y:auto; }
  #introScene { width:min(96vw,720px); aspect-ratio:400/250; border-radius:18px; overflow:hidden; flex-shrink:0;
    box-shadow:0 10px 30px rgba(0,0,0,.55); background:#0a1428; }
  #introScene { position:relative; }
  /* two stacked layers so scenes cross-fade into each other instead of cutting */
  #introScene .layer { position:absolute; inset:0; opacity:0; transition:opacity .75s ease; }
  #introScene .layer.on { opacity:1; }
  #introScene svg { width:100%; height:100%; display:block; animation:kenburns 13s ease-out both; }
  @keyframes kenburns { 0%{transform:scale(1.07)} 100%{transform:scale(1)} }
  #introCap { width:min(96vw,720px); background:rgba(255,255,255,.95); color:#2a2a2a; border-radius:16px; flex-shrink:0;
    padding:12px 18px; font-size:min(4vw,24px); line-height:1.35; min-height:2.6em; text-align:center; font-weight:600;
    animation:fadeUp .5s ease-out both; }
  #introBar, #introDots, .introBtns { flex-shrink:0; }
  #introDots { display:flex; gap:10px; }
  #introDots span { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.35); }
  #introDots span.on { background:#ffd23f; box-shadow:0 0 10px #ffd23f; }
  #introBar { width:min(96vw,760px); height:6px; background:rgba(255,255,255,.2); border-radius:3px; overflow:hidden; }
  #introBar i { display:block; height:100%; width:0; background:#7ec850; }
  .introBtns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .introBtns .bigbtn { font-size:min(4.5vw,24px); padding:10px 26px; }
  .grow { stroke-dasharray:700; stroke-dashoffset:700; animation:growRoot 5.2s ease-in-out forwards; }
  .hair { opacity:0; animation:fadeIn .8s ease-out 5s forwards; }
  .badge { opacity:0; transform-origin:center; animation:popIn .5s cubic-bezier(.2,1.6,.4,1) 6s forwards; }
  .eat { animation:popDot .7s ease-out 5.6s forwards; }
  .sprk { opacity:0; animation:sparkle 1.2s ease-out 5.9s forwards; }
  @keyframes growRoot { to{stroke-dashoffset:0} }
  @keyframes fadeIn { to{opacity:1} }
  @keyframes popIn { 0%{opacity:0;transform:scale(.3)} 100%{opacity:1;transform:scale(1)} }
  @keyframes popDot { 0%{transform:scale(1);opacity:1} 100%{transform:scale(2.2);opacity:0} }
  @keyframes sparkle { 0%{opacity:0;transform:scale(.5)} 40%{opacity:1} 100%{opacity:0;transform:scale(1.6)} }
  @keyframes sway { 0%,100%{transform:rotate(-1.3deg)} 50%{transform:rotate(1.3deg)} }
  @keyframes titlePop { 0%{transform:scale(.4);opacity:0} 100%{transform:scale(1);opacity:1} }
  @keyframes titleWiggle { 0%,100%{transform:rotate(-1.6deg)} 50%{transform:rotate(1.6deg)} }
  @keyframes fadeUp { 0%{transform:translateY(16px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  @keyframes btnPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-16px) rotate(6deg)} }
  @keyframes bob2 { 0%,100%{transform:translateY(0) rotate(5deg)} 50%{transform:translateY(-22px) rotate(-5deg)} }
  /* wheel */
  /* sized off the window HEIGHT too, so the wheel plus the result text plus the next button
     always fit on screen — on a short laptop the wheel shrinks instead of pushing the button off */
  #wheelBox { position:relative; width:min(88vw,56vh,640px); height:min(88vw,56vh,640px);
    flex-shrink:0; aspect-ratio:1; z-index:2; }
  #wheelRing { position:absolute; inset:0; border-radius:50%; border:6px solid #fff;
    box-shadow:0 8px 26px rgba(0,0,0,.45), inset 0 0 22px rgba(0,0,0,.25); z-index:1; }
  #rootHub { position:absolute; left:50%; top:50%; width:47%; height:47%;
    transform:translate(-50%,-50%); border-radius:50%; border:6px solid #fff;
    box-shadow:0 4px 16px rgba(0,0,0,.55); z-index:3; background:#0a1428; }
  #spinArrow { position:absolute; left:50%; top:50%; width:26px; height:36%;
    transform-origin:50% 100%; transform:translate(-50%,-100%) rotate(0deg);
    transition:transform 4s cubic-bezier(.15,.75,.25,1); z-index:5; pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .wSlot { position:absolute; width:31%; height:31%; border-radius:50%; z-index:4;
    transform:translate(-50%,-50%); transition:transform .3s, box-shadow .3s;
    box-shadow:0 0 0 6px var(--ring,#888), 0 4px 12px rgba(0,0,0,.4); }
  .wSlot.won { transform:translate(-50%,-50%) scale(1.22); z-index:7;
    box-shadow:0 0 0 5px #ffe14d, 0 0 24px 4px #ffd23f; }
  .wCartoon { width:100%; height:100%; border-radius:50%; overflow:hidden; border:6px solid #fff; background:#fff; }
  /* a whole living field behind the wheel, drawn like the story scenes */
  #wheelBg { position:absolute; inset:0; z-index:0; pointer-events:none; }
  #wheelBg svg { width:100%; height:100%; display:block; }
  #wheelChars { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  #wheelChars .char .tag { position:absolute; left:50%; bottom:-20px; transform:translateX(-50%); white-space:nowrap;
    background:rgba(255,255,255,.94); color:#3d2b15; font-weight:bold; font-size:min(2vw,14px);
    padding:2px 10px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #wheelBox { filter:drop-shadow(0 0 36px rgba(255,186,80,.55)); }
  #s_wheel h2, #s_wheel .sub, #s_wheel .bigbtn { position:relative; z-index:2; }
  /* tighter stacking so the bigger wheel still leaves the next button on screen */
  #s_wheel { gap:9px; padding:10px; }
  #wheelBg::after { content:""; position:absolute; inset:0; background:
    linear-gradient(180deg, rgba(0,0,0,.38) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 78%, rgba(0,0,0,.35) 100%); }
  @keyframes growCycle { 0%{stroke-dashoffset:520} 50%{stroke-dashoffset:0}
                         90%{stroke-dashoffset:0} 100%{stroke-dashoffset:520} }
  .bgRoot { stroke-dasharray:520; animation:growCycle 11s ease-in-out infinite; }
  .wCartoon svg { width:100%; height:100%; display:block; }
  /* design cards */
  #s_design { justify-content:flex-start; overflow-y:auto; padding-top:14px; gap:12px; }
  #cardGrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(96vw,900px); }
  .pair { background:rgba(255,255,255,.14); border-radius:16px; padding:8px; }
  .pairTitle { color:#ffe9a8; font-size:min(3.3vw,18px); font-weight:bold; margin-bottom:6px; text-shadow:1px 1px 2px #333;}
  .opts { display:flex; gap:8px; }
  .card { flex:1; font-size:min(3.2vw,17px); padding:8px 5px; border-radius:12px; border:4px solid transparent;
    background:#fffbe8; cursor:pointer; line-height:1.2; }
  .card .em { font-size:min(8vw,36px); display:block; }
  .card .av { display:block; width:min(17vw,84px); margin:0 auto 5px; }
  .card .av svg { width:100%; height:auto; display:block; border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.35); transition:transform .15s; }
  .card:hover .av svg { transform:scale(1.06); }
  .card.sel .av svg { box-shadow:0 0 0 3px #ff9d00, 0 3px 10px rgba(0,0,0,.4); }
  .card.sel { border-color:#ff9d00; background:#fff3c4; box-shadow:0 0 14px #ffbe45; }
  /* sim + results */
  #simWrap { position:relative; }
  #simCanvas { background:transparent; border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.5); display:block; }
  #dayBadge { position:absolute; top:10px; left:12px; background:rgba(0,0,0,.55); color:#fff;
    padding:6px 14px; border-radius:12px; font-size:22px; font-weight:bold; }
  #envBadge { position:absolute; top:10px; right:12px; background:rgba(0,0,0,.55); color:#fff;
    padding:6px 14px; border-radius:12px; font-size:22px; }
  #scoreBig { font-size:min(18vw,110px); font-weight:900; color:#ffe14d; text-shadow:4px 4px 0 #3d2b15; }
  .lesson { background:rgba(255,255,255,.92); color:#333; border-radius:16px; padding:14px 20px;
    font-size:min(4vw,22px); max-width:760px; text-align:left; }
  /* leaderboard */
  table.lb { background:rgba(255,255,255,.95); border-radius:14px; padding:8px; border-collapse:collapse;
    font-size:min(4.5vw,26px); min-width:min(90vw,480px); }
  table.lb td, table.lb th { padding:6px 16px; text-align:left; }
  table.lb tr:first-child { color:#7a5b1e; }
  .nameEntry { display:flex; gap:12px; }
  .letterCol { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .letter { font-size:56px; background:#fffbe8; border-radius:12px; width:80px; text-align:center; font-weight:900;}
  .arrowB { font-size:30px; padding:2px 22px; border-radius:10px; border:none; background:#7ec850; color:#fff; cursor:pointer;}
  #homeBtn { position:absolute; top:12px; left:12px; z-index:50; font-size:22px; padding:8px 16px;
    border-radius:12px; border:none; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; display:none;}
</style>
</head>
<body>
<button id="homeBtn" onclick="go('title')">🏠 Menu</button>

<div class="screen on" id="s_title">
  <img id="heroImg" src="ra-data/maize-hero.svg" alt="">
  <div id="stage">
    <!-- ROOTY: root buddy slurping water through a straw -->
    <div class="char big" style="left:2%;top:24%;animation:drift 14s ease-in-out infinite"><div class="act" style="animation:slurp 1.2s ease-in-out infinite"><svg viewBox="0 0 110 96" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(84,72)">
        <path d="M0 -18 C10 -3 15 4 15 11 a15 13 0 0 1 -30 0 C-15 4 -10 -3 0 -18Z" fill="#54bdf5" stroke="#2b95d0" stroke-width="1.8">
          <animateTransform attributeName="transform" type="scale" values="1;1;0.4;0.4;1" keyTimes="0;0.12;0.62;0.78;1" dur="4.5s" repeatCount="indefinite"/>
        </path>
        <ellipse cx="-5" cy="-3" rx="2.6" ry="4.5" fill="#fff" opacity=".55"/>
      </g>
      <circle cx="80" cy="66" r="1.6" fill="#d8f1ff"><animate attributeName="cy" values="70;52" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="88" cy="68" r="1.3" fill="#d8f1ff"><animate attributeName="cy" values="72;54" dur="1.9s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.9s" begin=".7s" repeatCount="indefinite"/></circle>
      <line x1="47" y1="50" x2="78" y2="64" stroke="#ff5b8a" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="47" y1="50" x2="78" y2="64" stroke="#fff" stroke-width="1.1" stroke-dasharray="3 3" opacity=".85"/>
      <g>
        <path d="M32 16 C50 16 56 30 54 48 C52 63 45 72 38 90 C31 72 24 63 22 48 C20 30 26 16 32 16Z" fill="#e6d7b0" stroke="#b39a6a" stroke-width="1.8"/>
        <g stroke="#b39a6a" stroke-width="1.3" stroke-linecap="round"><path d="M24 58l-7 3"/><path d="M52 60l7 4"/><path d="M28 70l-6 4"/><path d="M48 74l6 3"/><path d="M38 90v6"/></g>
        <ellipse cx="31" cy="36" rx="4.4" ry="4.8" fill="#fff"/><ellipse cx="44" cy="36" rx="4.4" ry="4.8" fill="#fff"/>
        <circle cx="32" cy="37" r="2.4" fill="#2a1d0e"><animate attributeName="r" values="2.4;2.4;0.2;2.4;2.4" keyTimes="0;.88;.92;.96;1" dur="3.6s" repeatCount="indefinite"/></circle>
        <circle cx="45" cy="37" r="2.4" fill="#2a1d0e"><animate attributeName="r" values="2.4;2.4;0.2;2.4;2.4" keyTimes="0;.88;.92;.96;1" dur="3.6s" repeatCount="indefinite"/></circle>
        <circle cx="26" cy="46" r="3.2" fill="#ff9db0" opacity=".8"><animate attributeName="r" values="3.2;4.6;3.2" dur="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="50" cy="46" r="3.2" fill="#ff9db0" opacity=".8"><animate attributeName="r" values="3.2;4.6;3.2" dur="1.2s" repeatCount="indefinite"/></circle>
        <ellipse cx="47" cy="50" rx="2.8" ry="2.2" fill="#7a3b2e"/>
      </g>
    </svg></div></div>
    <!-- WALLY the water drop: hops around -->
    <div class="char" data-who="wally" style="right:5%;top:8%;animation:wanderL 12s ease-in-out infinite"><div class="act" style="animation:hop 1.6s ease-in-out infinite"><svg viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg"><path d="M20 2C31 22 34 28 34 34a14 14 0 0 1-28 0C6 28 9 22 20 2Z" fill="#54bdf5" stroke="#2b95d0" stroke-width="2"/><ellipse cx="14" cy="18" rx="3.5" ry="6" fill="#fff" opacity=".55"/><circle cx="15" cy="33" r="2.4" fill="#0a3a5a"><animate attributeName="r" values="2.4;2.4;.2;2.4" keyTimes="0;.85;.9;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="25" cy="33" r="2.4" fill="#0a3a5a"><animate attributeName="r" values="2.4;2.4;.2;2.4" keyTimes="0;.85;.9;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="13" cy="38" r="2" fill="#ff9db0" opacity=".7"/><circle cx="27" cy="38" r="2" fill="#ff9db0" opacity=".7"/><path d="M15 39q5 4 10 0" fill="none" stroke="#0a3a5a" stroke-width="2.2" stroke-linecap="round"/></svg></div></div>
    <!-- SUNNY: rays spin, winks, drifts -->
    <div class="char" style="left:6%;top:3%;animation:drift 16s ease-in-out infinite reverse"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><g stroke="#ffb43f" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="14s" repeatCount="indefinite"/><line x1="24" y1="2" x2="24" y2="8"/><line x1="24" y1="40" x2="24" y2="46"/><line x1="2" y1="24" x2="8" y2="24"/><line x1="40" y1="24" x2="46" y2="24"/><line x1="8" y1="8" x2="12" y2="12"/><line x1="40" y1="8" x2="36" y2="12"/><line x1="8" y1="40" x2="12" y2="36"/><line x1="40" y1="40" x2="36" y2="36"/></g><circle cx="24" cy="24" r="13" fill="#ffd23f"/><ellipse cx="19" cy="22" rx="2" ry="2" fill="#b3781a"><animate attributeName="ry" values="2;2;.2;2;2" keyTimes="0;.8;.85;.9;1" dur="4s" repeatCount="indefinite"/></ellipse><circle cx="29" cy="22" r="2" fill="#b3781a"/><circle cx="16" cy="27" r="2.2" fill="#ff9e7a" opacity=".7"/><circle cx="32" cy="27" r="2.2" fill="#ff9e7a" opacity=".7"/><path d="M19 28q5 5 10 0" fill="none" stroke="#b3781a" stroke-width="2" stroke-linecap="round"/></svg></div>
    <!-- N & P: bouncing nutrient balls -->
    <div class="char" data-who="nball" style="left:3%;bottom:30%;animation:wanderR 13s ease-in-out infinite"><div class="act" style="animation:ballBounce 1.3s ease-in-out infinite"><svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><circle cx="22" cy="22" r="19" fill="#4caf50" stroke="#3a8a3a" stroke-width="2"/><ellipse cx="15" cy="13" rx="4" ry="2.5" fill="#fff" opacity=".35"/><text x="22" y="17" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">N</text><circle cx="17" cy="25" r="1.8" fill="#0a3a0a"/><circle cx="27" cy="25" r="1.8" fill="#0a3a0a"/><path d="M18 29q4 3 8 0" fill="none" stroke="#0a3a0a" stroke-width="1.8" stroke-linecap="round"/></svg></div></div>
    <div class="char" data-who="pball" style="right:4%;bottom:32%;animation:wanderL 15s ease-in-out infinite"><div class="act" style="animation:ballBounce 1.5s ease-in-out .4s infinite"><svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><circle cx="22" cy="22" r="19" fill="#e6892a" stroke="#c06f16" stroke-width="2"/><ellipse cx="15" cy="13" rx="4" ry="2.5" fill="#fff" opacity=".35"/><text x="22" y="17" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">P</text><circle cx="17" cy="25" r="1.8" fill="#5a2d0a"/><circle cx="27" cy="25" r="1.8" fill="#5a2d0a"/><path d="M18 29q4 3 8 0" fill="none" stroke="#5a2d0a" stroke-width="1.8" stroke-linecap="round"/></svg></div></div>
    <!-- WIGGLY the root worm: inches across the soil and turns around -->

/* ============ ROOT AVATARS (one per trait card) ============
   Every avatar is a little root character living in soil, drawn so a kid can SEE the trait. */
function avFace(x,y,s,mood){
  const eyes = (mood==="calm")
    ? `<path d="M-6 0 Q-4 -3 -2 0" fill="none" stroke="#3a2410" stroke-width="1.7" stroke-linecap="round"/>
       <path d="M2 0 Q4 -3 6 0" fill="none" stroke="#3a2410" stroke-width="1.7" stroke-linecap="round"/>`
    : `<circle cx="-4" cy="0" r="2.7" fill="#3a2410"/><circle cx="4" cy="0" r="2.7" fill="#3a2410"/>
       <circle cx="-3.1" cy="-.9" r="1" fill="#fff"/><circle cx="4.9" cy="-.9" r="1" fill="#fff"/>`;
  const mouth = (mood==="wow")
    ? `<ellipse cx="0" cy="6" rx="3" ry="3.6" fill="#8a3a2b"/>`
    : `<path d="M-4.5 5 Q0 9.5 4.5 5" fill="none" stroke="#3a2410" stroke-width="1.9" stroke-linecap="round"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">
    <circle cx="-9" cy="4" r="2.6" fill="#ff9d9d" opacity=".75"/><circle cx="9" cy="4" r="2.6" fill="#ff9d9d" opacity=".75"/>
    ${eyes}${mouth}</g>`;
}
function avTile(id, body, opt){
  opt = opt || {};
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="${id}c"><rect width="100" height="100" rx="14"/></clipPath>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6a3c"/><stop offset="1" stop-color="#4b2e16"/></linearGradient>
    <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6ddaf"/><stop offset=".5" stop-color="#e5b676"/><stop offset="1" stop-color="#bf8842"/></linearGradient>
  </defs>
  <g clip-path="url(#${id}c)">
    ${opt.noSky
      ? `<rect width="100" height="100" fill="url(#${id}s)"/>`
      : `<rect width="100" height="100" fill="#bfe6f8"/>
         <rect y="30" width="100" height="70" fill="url(#${id}s)"/>
         <rect y="27" width="100" height="5" fill="#4b9433"/>
         <path d="M8 27 l3 -7 M20 27 l-3 -6 M34 27 l3 -7 M48 27 l-2 -6 M62 27 l3 -7 M76 27 l-3 -6 M90 27 l3 -7"
               stroke="#4b9433" stroke-width="2.6" stroke-linecap="round" fill="none"/>`}
    ${body}
  </g></svg>`;
}

const WHEEL_POS={Perfect:["50%","16%"],Drought:["84%","50%"],LowN:["50%","84%"],LowP:["16%","50%"]};
const WHEEL_ANGLE={Perfect:0,Drought:90,LowN:180,LowP:270};   // arrow rotation to point at each
/* ================= the wheel screen's world =================
   A dusk field seen from ground level, cut open so you can see the roots. The wheel sits where
   the sun would be, so the rays and the glow come from it. Everything here is procedural. */
function rng(seed){ let v=seed; return ()=>{ v=(v*9301+49297)%233280; return v/233280; }; }

function epicCorn(x,gy,hgt,seed){
  const r=rng(seed), top=gy-hgt, toC=(x<800)?1:-1;          // toC = direction toward the wheel (the light)
  let s=`<g>`;
  s+=`<path d="M${x-14} ${gy} L${x-6} ${top+42} L${x+6} ${top+42} L${x+14} ${gy} Z" fill="url(#wbStem)"/>`;
  s+=`<path d="M${x+toC*12.5} ${gy-4} L${x+toC*5.5} ${top+46}" stroke="#ffd27a" stroke-width="2.4" opacity=".55" stroke-linecap="round"/>`;
  for(let i=1;i<=8;i++){ const yy=gy-(hgt-70)*i/9, w=13.5-7.5*i/9;
    s+=`<ellipse cx="${x}" cy="${yy.toFixed(1)}" rx="${w.toFixed(1)}" ry="3.4" fill="#0d2008"/>`; }
  // eight blade leaves, alternating sides, each rising then drooping at the tip
  for(let i=0;i<8;i++){
    const t=0.13+i*0.1, by=gy-hgt*t, side=(i%2?1:-1);
    const len=hgt*0.46*(1-0.3*Math.abs(t-0.5))*(0.88+r()*0.28);
    const rise=len*(0.5+r()*0.15), th=15+len*0.045;
    const ex=x+side*len, ey=by-rise*0.55;
    const c1x=x+side*len*0.22, c1y=by-rise*0.85, c2x=x+side*len*0.66, c2y=by-rise*1.02;
    s+=`<path d="M${x} ${by-7} C${c1x.toFixed(1)} ${(c1y-th*0.25).toFixed(1)} ${c2x.toFixed(1)} ${(c2y-th*0.35).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`+
       ` C${(c2x+side*3).toFixed(1)} ${(c2y+th*0.75).toFixed(1)} ${c1x.toFixed(1)} ${(c1y+th).toFixed(1)} ${x} ${by+7} Z" fill="url(#wbLeaf)"/>`;
    const lit = (side===toC);
    s+=`<path d="M${x} ${by} C${c1x.toFixed(1)} ${(c1y+th*0.3).toFixed(1)} ${c2x.toFixed(1)} ${(c2y+th*0.2).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}"`+
       ` stroke="${lit?"#ffd27a":"#8fd35a"}" stroke-width="${lit?1.6:1.1}" fill="none" opacity="${lit?.6:.3}"/>`;
  }
  // tassel
  for(let i=0;i<7;i++){ const a=(-63+i*21)*Math.PI/180, L=70+r()*34;
    const tx=x+Math.sin(a)*L, ty=top+42-Math.cos(a)*L;
    s+=`<path d="M${x} ${top+42} Q${(x+(tx-x)*0.45).toFixed(1)} ${(top+42-(top+42-ty)*0.8).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}" stroke="#d9b264" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    for(let k=1;k<=5;k++){ const f=k/5; s+=`<circle cx="${(x+(tx-x)*f).toFixed(1)}" cy="${(top+42+(ty-top-42)*f).toFixed(1)}" r="2" fill="#f3d27a"/>`; }
  }
  // an ear of corn on the outer side, husk half open
  const es=-toC, ex0=x+es*17, ey0=gy-hgt*0.42;
  s+=`<g transform="translate(${ex0},${ey0.toFixed(1)}) rotate(${es*15})">`;
  s+=`<ellipse cx="0" cy="0" rx="13" ry="48" fill="#dcb257"/>`;
  for(let row=0;row<6;row++) for(let col=-1;col<=1;col++){ const ky=-42+row*8, kx=col*7*(1-row*0.03);
    s+=`<circle cx="${kx.toFixed(1)}" cy="${ky}" r="3.1" fill="#f2d072" stroke="#b8903c" stroke-width=".8"/>`; }
  s+=`<path d="M-15 48 C-24 10 -20 -26 -7 -50 C-3 -18 -5 12 -15 48Z" fill="url(#wbLeaf)"/>`;
  s+=`<path d="M15 48 C24 10 20 -26 7 -50 C3 -18 5 12 15 48Z" fill="url(#wbLeaf)"/>`;
  s+=`<path d="M-4 -48 q-6 -16 -14 -22 M0 -49 q0 -18 -4 -26 M4 -48 q7 -15 15 -20" stroke="#e9c98a" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
  s+=`</g>`;
  return s+`</g>`;
}

function epicRoots(x,gy,n,seed){
  const r=rng(seed), main=[], lat=[];
  function grow(px,py,ang,len,w,depth){
    let cx=px, cy=py, a=ang; const steps=Math.max(4,Math.round(len/26));
    let d=`M${cx.toFixed(1)} ${cy.toFixed(1)}`;
    for(let i=0;i<steps;i++){
      a=a*0.84+(r()-0.5)*0.34;                                   // gravity wins a little more every step
      const nx=cx+Math.sin(a)*26, ny=cy+Math.cos(a)*26, mx=(cx+nx)/2+(r()-0.5)*4, my=(cy+ny)/2;
      const seg=`M${cx.toFixed(1)} ${cy.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)}`;
      if(depth===0) main.push({d:seg, w:w*(1-0.72*i/steps)});   // main roots taper segment by segment
      else d+=` Q${mx.toFixed(1)} ${my.toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)}`;
      if(depth<2 && i>0 && r()<0.26) grow(nx,ny,a+(r()<0.5?-1:1)*(0.8+r()*0.7),len*0.3,w*0.42,depth+1);
      cx=nx; cy=ny;
    }
    if(depth>0) lat.push({d,w});
  }
  for(let i=0;i<n;i++){ const a=(-1.3+2.6*i/(n-1))+(r()-0.5)*0.25;
    grow(x+(r()-0.5)*16, gy+2, a, 250+r()*230, 4.6+r()*3.2, 0); }
  let s=`<g filter="url(#wbGlow)" stroke="#ffb54a" fill="none" stroke-linecap="round" opacity=".45">`;
  main.forEach(p=>{ s+=`<path d="${p.d}" stroke-width="${(p.w+5).toFixed(1)}"/>`; });
  s+=`</g><g stroke="url(#wbRootD)" fill="none" stroke-linecap="round">`;
  lat.forEach(p=>{ s+=`<path d="${p.d}" stroke-width="${p.w.toFixed(1)}"/>`; });
  main.forEach(p=>{ s+=`<path d="${p.d}" stroke-width="${p.w.toFixed(1)}"/>`; });
  return s+`</g>`;
}

function wheelBackdrop(){

  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="wbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/><stop offset=".42" stop-color="#2a1e58"/>
      <stop offset=".78" stop-color="#8a3f5a"/><stop offset="1" stop-color="#ff9a3c"/></linearGradient>
    <radialGradient id="wbSun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".3" stop-color="#ffcf6a" stop-opacity=".85"/>
      <stop offset=".65" stop-color="#ff8f3a" stop-opacity=".35"/><stop offset="1" stop-color="#ff8f3a" stop-opacity="0"/></radialGradient>
    <linearGradient id="wbSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4526"/><stop offset=".25" stop-color="#48301a"/>
      <stop offset=".6" stop-color="#2a1a0d"/><stop offset="1" stop-color="#120a04"/></linearGradient>
    <linearGradient id="wbStem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#132c0e"/><stop offset=".5" stop-color="#2d6a22"/><stop offset="1" stop-color="#0f230b"/></linearGradient>
    <linearGradient id="wbLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8f2f"/><stop offset=".6" stop-color="#1f5a19"/><stop offset="1" stop-color="#0d2a0a"/></linearGradient>
    <linearGradient id="wbRootD" gradientUnits="userSpaceOnUse" x1="0" y1="${gy}" x2="0" y2="${gy+480}">
      <stop offset="0" stop-color="#ffe2a8"/><stop offset=".45" stop-color="#e2b876"/><stop offset="1" stop-color="#8d5f33"/></linearGradient>
    <radialGradient id="wbVig" cx=".5" cy=".5" r=".72">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></radialGradient>
    <filter id="wbGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="wbBlurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>`;
  // ---- sky, stars, the glow the wheel sits in, and slow god rays ----
  s+=`<rect width="${W}" height="${H}" fill="url(#wbSky)"/>`;
  for(let i=0;i<70;i++){ const sx=r()*W, sy=r()*gy*0.7, rr=0.7+r()*1.6;
    s+=`<circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="${rr.toFixed(1)}" fill="#fff"><animate attributeName="opacity" values="${(0.2+r()*0.5).toFixed(2)};1;${(0.2+r()*0.5).toFixed(2)}" dur="${(2+r()*4).toFixed(1)}s" begin="${(r()*4).toFixed(1)}s" repeatCount="indefinite"/></circle>`; }
  s+=`<g opacity=".16"><animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="150s" repeatCount="indefinite"/>`;
  for(let i=0;i<14;i++){ const a=i*(Math.PI*2/14), a2=a+0.09;

/* ================= data access ================= */
function grams(combo, env){ return window.RA_SCORES.grams[combo+"_"+env]; }
function bestOf(env){ return window.RA_SCORES.best[env]; }
function bestComboOf(env){
  let bc=null, bg=-1;
  for(const k in window.RA_SCORES.grams){
    const i=k.lastIndexOf("_");
    if(k.slice(i+1)!==env) continue;
    if(window.RA_SCORES.grams[k]>bg){ bg=window.RA_SCORES.grams[k]; bc=k.slice(0,i); }
  }
  return bc;
}
function rootDataKey(combo, env){
  const avail=window.RA_AVAILABLE||[];
  if(!avail.length) return null;
  // 1) exact combo+env  2) same combo, any env  3) nearest combo (fewest trait diffs)
  if(avail.includes(combo+"_"+env)) return combo+"_"+env;
  const sameCombo=avail.find(a=>a.startsWith(combo+"_"));
  if(sameCombo) return sameCombo;
  const parts=combo.match(/../g);
  let bestKey=null, bestD=99;
  const envPref={Perfect:0,Drought:1,LowN:2,LowP:3};
  avail.forEach(a=>{
    const i=a.lastIndexOf("_"), ac=a.slice(0,i), ae=a.slice(i+1);
    const ap=ac.match(/../g);
    let d=0; for(let k=0;k<4;k++) if(ap[k]!==parts[k]) d++;
    d = d*10 + Math.abs((envPref[ae]||0)-(envPref[env]||0)); // tie-break: closer env
    if(d<bestD){ bestD=d; bestKey=a; }
  });
  return bestKey;
}
const loadedScripts={};
function loadRoots(key){
  return new Promise((res,rej)=>{
    if(!key) return rej("no data");
    if(window.RA_ROOTS && window.RA_ROOTS[key]) return res(window.RA_ROOTS[key]);
    if(loadedScripts[key]) return loadedScripts[key].then(()=>res(window.RA_ROOTS[key]));
    loadedScripts[key]=new Promise((res2)=>{
      const s=document.createElement("script");
      s.src="ra-data/roots/"+key+".js";
      s.onload=()=>res2(); s.onerror=()=>res2();
      document.head.appendChild(s);
    });
    loadedScripts[key].then(()=>{ (window.RA_ROOTS&&window.RA_ROOTS[key])?res(window.RA_ROOTS[key]):rej("load fail"); });
  });
}

let animId=null;
const RES={water:{c:"#2f9fe0",label:"💧 Water"}, N:{c:"#3fae63",label:"🟢 Nitrogen"}, P:{c:"#e6892a",label:"🟠 Phosphorus"}};
// per weather: for each resource -> how many dots + depth band [shallow,deep] in cm
function resourcePlan(env){
  return {
    water: env==="Drought" ? {n:26,y0:70,y1:150} : {n:62,y0:2,y1:150},
    N:     env==="LowN"    ? {n:16,y0:55,y1:150} : {n:48,y0:5,y1:120},
    P:     env==="LowP"    ? {n:11,y0:1, y1:14 } : {n:40,y0:1,y1:26}
  };
}
/* roots are drawn pale, like a real washed root, and only take on colour where they drink */
function rootStroke(lctx, soilY, H){
  const g=lctx.createLinearGradient(0, soilY, 0, H);
  g.addColorStop(0, "#faf5ea"); g.addColorStop(1, "#e4d8c0");
  return g;
}
const TINT={water:"120,205,255", N:"205,240,110", P:"255,95,95"};
function tintRoot(lctx, x, y, type, r){
  // paint only onto pixels that already hold root, so the root itself turns blue / yellow / red
  lctx.save(); lctx.globalCompositeOperation="source-atop"; lctx.globalAlpha=1;
  const g=lctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${TINT[type]},.95)`); g.addColorStop(.5,`rgba(${TINT[type]},.6)`); g.addColorStop(1,`rgba(${TINT[type]},0)`);
  lctx.fillStyle=g; lctx.beginPath(); lctx.arc(x,y,r,0,7); lctx.fill(); lctx.restore();
}
function picksOf(code){ return {depth:code.slice(0,2),speed:code.slice(2,4),hairs:code.slice(4,6),thick:code.slice(6,8),bush:code.slice(8,10),air:code.slice(10,12)}; }
function shapeOf(p){ return p.depth+p.speed+p.hairs+"Ma"; }
function roundRect(ctx,x,y,w,hh,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+hh,r); ctx.arcTo(x+w,y+hh,x,y+hh,r); ctx.arcTo(x,y+hh,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
/* the ground, drawn once per run: sky, grass, layered soil with grain, stones and a depth ruler */
function makeSoil(PW,H,soilY,sc,visD,seed){
  const c=document.createElement("canvas"); c.width=PW; c.height=H; const g=c.getContext("2d"); const r=rng(seed);
  const sky=g.createLinearGradient(0,0,0,soilY); sky.addColorStop(0,"#63b1e6"); sky.addColorStop(1,"#dff1fb");
  g.fillStyle=sky; g.fillRect(0,0,PW,soilY);
  const soil=g.createLinearGradient(0,soilY,0,H);
  soil.addColorStop(0,"#8f6a41"); soil.addColorStop(.28,"#6f4d2c"); soil.addColorStop(.7,"#4a321b"); soil.addColorStop(1,"#27180b");
  g.fillStyle=soil; g.fillRect(0,soilY,PW,H-soilY);
  for(let i=1;i<=5;i++){ const y=soilY+(H-soilY)*i/6+(r()-.5)*16;                 // strata
    g.fillStyle=`rgba(0,0,0,${(0.05+r()*0.07).toFixed(3)})`; g.fillRect(0,y,PW,4+r()*12); }
  for(let i=0;i<420;i++){ g.fillStyle=r()<.55?"rgba(0,0,0,.22)":"rgba(255,228,185,.13)";  // grain
    g.beginPath(); g.arc(r()*PW, soilY+4+r()*(H-soilY-4), .8+r()*2.4, 0, 7); g.fill(); }
  for(let i=0;i<20;i++){ const x=r()*PW, y=soilY+30+r()*(H-soilY-50), w=5+r()*12;      // stones
    g.fillStyle="#5b4029"; g.beginPath(); g.ellipse(x,y,w,w*.65,0,0,7); g.fill();
    g.fillStyle="rgba(255,255,255,.15)"; g.beginPath(); g.ellipse(x-w*.2,y-w*.25,w*.5,w*.28,0,0,7); g.fill(); }
  g.fillStyle="#3f8a2e"; g.fillRect(0,soilY-5,PW,7);                                    // grass
  g.strokeStyle="#3f8a2e"; g.lineWidth=2.2; g.lineCap="round";
  for(let x=4;x<PW;x+=9){ g.beginPath(); g.moveTo(x,soilY-4); g.lineTo(x+(r()<.5?-3:3), soilY-13-r()*8); g.stroke(); }
  const step = visD>90 ? 50 : 25;                                                      // ruler
  g.fillStyle="rgba(255,255,255,.55)"; g.font="12px 'Segoe UI',sans-serif"; g.textAlign="left"; g.textBaseline="alphabetic";
  for(let d=step; d<=visD; d+=step){ const y=soilY+d*sc; g.fillRect(6,y,26,1); g.fillText(d+" cm",6,y-4); }
  return c;
}
async function runSim(){
  go("sim");
  lastLeft=null;
  const E=ENVS[curEnv];
  document.getElementById("simTitle").textContent="Your root vs the champion — growing side by side";
  document.getElementById("envBadge").textContent=E.em+" "+E.name;
  document.getElementById("harvestBtn").style.display="none";
  const cv=document.getElementById("simCanvas");
  const W=Math.min(window.innerWidth*0.96, 1240), H=Math.min(window.innerHeight*0.72, 820);
  cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d"); ctx.lineJoin="round";
  const PW=W/2, soilY=H*0.25;

  /* two roots grow together on identical soil: the kid's design, and the best design for this
     field, so the difference they see is the root and nothing else */
  const myCode=comboCode(), champCode=bestComboOf(curEnv);
  const panels=[ {label:"YOUR ROOT", p:Object.assign({},picks), code:myCode},
                 {label: champCode===myCode ? "CHAMPION — that's YOU! 🏆" : "CHAMPION ROOT 🏆", p:picksOf(champCode), code:champCode} ];
  await Promise.all(panels.map(async P=>{ try{ P.data=await loadRoots(rootDataKey(shapeOf(P.p),curEnv)); }catch(e){ P.data=null; } }));

  let maxD=40, maxHW=8;
  panels.forEach(P=>{
    /* The 16 real OSR geometries barely differ in depth (gravitropism pulls them all down), so the
       Deep/Shallow card would be invisible. Stretch the real root to match the card that was picked. */
    const shallow=P.p.depth==="Sh";
    P.yMul= shallow?0.48:1.0; P.xMul= shallow?1.55:0.85;
    P.thickMul=(P.p.thick==="Th")?1.7:(P.p.thick==="Sk")?0.6:1;
    P.sparse=P.p.bush==="Sp"; P.airy=P.p.air==="Ai";
    P.fuzzy=P.p.hairs==="Fz";                          // root hairs: drawn, and they widen the drinking reach
    P.timeMul=(P.p.speed==="Fa")?1:0.68;               // Steady grows slower, so it is visibly shorter all the way
    P.segs=[]; P.byRoot=[];
    if(P.data) P.data.roots.forEach((r,ri)=>{
      const maxR=r.p.reduce((m,q)=>Math.max(m,q[4]||0),0), lateral=maxR<0.03;
      if(lateral && P.sparse && (ri*13)%100>=30) return;          // Sparse keeps ~30% of side roots
      const R=P.byRoot.length; P.byRoot.push([]); P.byRoot[R].n=r.p.length-1;
      for(let i=1;i<r.p.length;i++){ const a=r.p[i-1],b=r.p[i];
        P.byRoot[R].push(P.segs.length);
        P.segs.push([a[0],a[1],b[0],b[1],Math.max(a[3],b[3]),b[4],lateral?1:0,R,i-1]);
        maxD=Math.max(maxD,-b[1]*P.yMul); maxHW=Math.max(maxHW,Math.abs(b[0])*P.xMul); }
    });
    P.segs.sort((x,y)=>x[4]-y[4]);
    P.endDay=(P.data&&P.data.endTime)||40;
  });
  // one shared ruler for both panels, zoomed so the deeper of the two roots fills its panel
  const visD=Math.min(110, maxD*1.06);
  const sc=Math.min((PW*0.46)/Math.max(maxHW,10), (H-soilY-36)/visD);
  const px=x=>PW/2+x*sc, py=y=>soilY-y*sc;

  const soilImg=makeSoil(PW,H,soilY,sc,visD,curEnv.length*17+3);
  // the same resource dots, in the same places, in both panels
  const plan=resourcePlan(curEnv), kD=visD/150, seedDots=[];
  { const r=rng(4242); const halfW=Math.min(15.5,(PW*0.46)/sc);
    for(const type in plan){ const s=plan[type];
      for(let i=0;i<s.n;i++) seedDots.push({type, gx:(r()*2-1)*halfW, d:(s.y0+r()*(s.y1-s.y0))*kD}); } }

  panels.forEach((P,pi)=>{
    P.xo=pi*PW;
    P.dots=seedDots.map(o=>({x:px(o.gx), y:soilY+o.d*sc, type:o.type, gone:false}));
    /* what a root drinks is decided only by what it reaches, so two roots that grow differently eat
       differently, and a root never passes a dot without taking it. Root hairs widen the reach for
       nutrients (that is their job); a smooth root has to nearly touch a dot to get it. */
    P.PX=x=>px(x*P.xMul); P.PY=y=>py(y*P.yMul);
    P.layer=document.createElement("canvas"); P.layer.width=PW; P.layer.height=H;
    P.l=P.layer.getContext("2d"); P.l.lineCap="round"; P.l.lineJoin="round";
    P.pale=rootStroke(P.l,soilY,H);
    P.alpha=P.airy?0.55:0.95;                         // Airy = lighter, see-through; Solid = dense
    /* colour spreads through the whole system: each uptake starts a wave that grows outward and
       settles, and the waves pile up until every root carries the colour of what it drank */
    P.CS=document.createElement("canvas"); P.CS.width=PW; P.CS.height=H;   // settled waves
    P.C =document.createElement("canvas"); P.C.width=PW;  P.C.height=H;    // this frame's colour
    P.T =document.createElement("canvas"); P.T.width=PW;  P.T.height=H;    // roots x colour
    P.blobs=[]; P.blobR=Math.max(110, sc*34); P.vig=0;
    P.idx=0; P.sparks=[];
  });

  const grab=Math.max(9,sc*3.2);
  const endDay=Math.max(...panels.map(P=>P.endDay));
  let day=0, swept=false, sweepEnd=0, done=false;
  const t0=performance.now(), DUR=14000;            // 40 simulated days over 14 s
  cancelAnimationFrame(animId);
  function segWidth(P,s){ return Math.max(1.1, Math.min(12, s[5]*2*sc*1.7*P.thickMul)); }
  function drawSeg(P,s,x2,y2){
    const l=P.l;
    l.globalCompositeOperation="source-over"; l.globalAlpha=P.alpha;
    l.strokeStyle=P.pale; l.lineWidth=segWidth(P,s); l.lineCap="round";
    const x1=P.PX(s[0]), y1=P.PY(s[1]);
    l.beginPath(); l.moveTo(x1,y1); l.lineTo(x2,y2); l.stroke();
    if(P.fuzzy && s[5]>=0.03 && (s[8]&1)===0){            // root hairs on the main roots, so Fuzzy LOOKS fuzzy
      const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L, w=l.lineWidth, hl=w*1.2+3;
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      l.globalAlpha=0.55*P.alpha; l.lineWidth=0.9;
      l.beginPath(); l.moveTo(mx+nx*w*.5,my+ny*w*.5); l.lineTo(mx+nx*(w*.5+hl),my+ny*(w*.5+hl)+1.2);
      l.moveTo(mx-nx*w*.5,my-ny*w*.5); l.lineTo(mx-nx*(w*.5+hl),my-ny*(w*.5+hl)+1.2); l.stroke();
    }
  }
  /* water flows from where it was taken up toward the plant, so the colour runs UP the root and
     fades out: a gradient along the root, painted only onto root pixels */
  function drinkAlong(P,s,type,sc){
    const l=P.l, ids=P.byRoot[s[7]], k=s[8], span=Math.min(k+1, s[6]?20:70);
    l.globalCompositeOperation="source-atop";
    for(let j=0;j<span;j++){
      const q=P.segs[ids[k-j]], f=1-j/span;
      l.globalAlpha=0.97*f+0.03; l.strokeStyle=`rgb(${TINT[type]})`; l.lineWidth=segWidth(P,q)+2.2;
      l.beginPath(); l.moveTo(P.PX(q[0]),P.PY(q[1])); l.lineTo(P.PX(q[2]),P.PY(q[3])); l.stroke();
    }
    l.globalAlpha=1; l.globalCompositeOperation="source-over";
    tintRoot(l,P.PX(s[2]),P.PY(s[3]),type,Math.max(14,sc*5));   // bright spot right where it drank
  }
  function drawPanel(P,t){
    ctx.drawImage(soilImg,P.xo,0);
    ctx.save(); ctx.translate(P.xo,0);
    drawDots(ctx,P.dots,swept);
    // grow this frame's waves; a finished wave is stamped onto the settled canvas once and dropped
    const c=P.C.getContext("2d"); c.clearRect(0,0,PW,H); c.drawImage(P.CS,0,0);
    const cs=P.CS.getContext("2d");
    for(let i=P.blobs.length-1;i>=0;i--){ const b=P.blobs[i], age=(t-b.t0)/2600; if(age<0) continue;
      const f=Math.min(1,age), R=P.blobR*(0.12+0.88*f);
      const paint=(g2)=>{ const g=g2.createRadialGradient(b.x,b.y,0,b.x,b.y,R);
        g.addColorStop(0,`rgba(${TINT[b.type]},.62)`); g.addColorStop(.55,`rgba(${TINT[b.type]},.34)`); g.addColorStop(1,`rgba(${TINT[b.type]},0)`);
        g2.fillStyle=g; g2.beginPath(); g2.arc(b.x,b.y,R,0,7); g2.fill(); };
      if(f>=1){ paint(cs); P.blobs.splice(i,1); } else paint(c);
    }
    const tt=P.T.getContext("2d"); tt.clearRect(0,0,PW,H);
    tt.globalCompositeOperation="source-over"; tt.drawImage(P.layer,0,0);
    tt.globalCompositeOperation="source-atop"; tt.drawImage(P.C,0,0);     // colour lands on root pixels only
    ctx.drawImage(P.T,0,0);
    for(let i=P.sparks.length-1;i>=0;i--){ const sp=P.sparks[i], age=(t-sp.t0)/450;
      if(age<0) continue; if(age>=1){ P.sparks.splice(i,1); continue; }
      ctx.beginPath(); ctx.arc(sp.x,sp.y,3+age*10,0,7); ctx.strokeStyle=sp.c;
      ctx.globalAlpha=1-age; ctx.lineWidth=2.5; ctx.stroke(); ctx.globalAlpha=1; }
    const eaten=P.dots.reduce((n,d)=>n+(d.gone?1:0),0)/Math.max(1,P.dots.length);
    P.vig=P.vig*0.94+eaten*0.06;                                  // fed roots grow a bigger, greener plant
    paintPlant(ctx,PW/2,soilY,day*P.timeMul/endDay,P.vig,t);
    ctx.font="bold 15px 'Segoe UI',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    const tw=ctx.measureText(P.label).width+28;
    ctx.fillStyle="rgba(0,0,0,.5)"; roundRect(ctx,PW/2-tw/2,soilY+10,tw,26,13); ctx.fill();
    ctx.fillStyle="#fff"; ctx.fillText(P.label,PW/2,soilY+23);
    ctx.restore();
  }
  function frame(t){
    day=Math.max(0,Math.min(endDay,(t-t0)/DUR*endDay));
    panels.forEach(P=>{
      while(P.idx<P.segs.length && P.segs[P.idx][4]<=day*P.timeMul){
        const s=P.segs[P.idx++], x2=P.PX(s[2]), y2=P.PY(s[3]);
        drawSeg(P,s,x2,y2);
        for(const d of P.dots){ if(d.gone) continue;                // the growing tip drinks what it reaches
          const gR = grab*(P.fuzzy ? (d.type==="water"?1.25:2.0) : 0.8);
          if(Math.abs(d.x-x2)<gR && Math.abs(d.y-y2)<gR){ d.gone=true;
            P.sparks.push({x:d.x,y:d.y,c:RES[d.type].c,t0:t}); drinkAlong(P,s,d.type,sc);
            P.blobs.push({x:d.x,y:d.y,type:d.type,t0:t}); } }
      }
    });
    panels.forEach(P=>drawPanel(P,t));
    ctx.setLineDash([6,8]); ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(PW,0); ctx.lineTo(PW,H); ctx.stroke(); ctx.setLineDash([]);
    drawLegend(ctx,W,H);
    document.getElementById("dayBadge").textContent="Day "+Math.floor(day);
    if(day<endDay){ animId=requestAnimationFrame(frame); }
    else if(!swept){
      swept=true; sweepEnd=t+900;
      document.getElementById("simTitle").textContent="Day 40 — both roots are fully grown";
      animId=requestAnimationFrame(frame);
    }
    else if(t<sweepEnd){ animId=requestAnimationFrame(frame); }
    else {
      if(!done){ done=true;
        lastLeft={water:0,N:0,P:0}; for(const d of panels[0].dots){ if(!d.gone) lastLeft[d.type]++; }
        const tot=lastLeft.water+lastLeft.N+lastLeft.P;
        document.getElementById("simTitle").textContent = tot===0
          ? "Day 40 — your root grabbed EVERYTHING! 🎉"
          : "Day 40 — look at the soil: what did each root leave behind? 👀";
        document.getElementById("harvestBtn").style.display="inline-block"; }
      animId=requestAnimationFrame(frame);          // keep the leftovers gently pulsing
    }
  }
  animId=requestAnimationFrame(frame);
}
/* what the root could not reach — short form fits on the sim title, long form for the results card */
function leftStr(L, short){
  const bits=[];
  if(L.water) bits.push(short ? `💧${L.water}` : `💧 ${L.water} water`);
  if(L.N)     bits.push(short ? `🟢${L.N}`     : `🟢 ${L.N} nitrogen`);
  if(L.P)     bits.push(short ? `🟠${L.P}`     : `🟠 ${L.P} phosphorus`);
  return bits.join(short ? "  " : "  ·  ");
}
function drawDots(ctx,dots,pulse){
  const p = pulse ? (1+Math.sin(performance.now()/260))/2 : 0;   // leftovers breathe, so they get noticed
  for(const d of dots){ if(d.gone) continue;
    ctx.beginPath(); ctx.arc(d.x,d.y,4.5,0,7);
    ctx.fillStyle=RES[d.type].c; ctx.globalAlpha=.9; ctx.fill();
    ctx.globalAlpha=.35; ctx.lineWidth=3; ctx.strokeStyle=RES[d.type].c; ctx.stroke();
    if(pulse){ ctx.beginPath(); ctx.arc(d.x,d.y,7+p*7,0,7);
      ctx.globalAlpha=.55*(1-p); ctx.lineWidth=2.5; ctx.strokeStyle=RES[d.type].c; ctx.stroke(); }
    ctx.globalAlpha=1;
  }
}
function drawLegend(ctx,W,H){
  const items=Object.values(RES); const y=H-16; let x=12;
  ctx.font="bold 13px 'Segoe UI',sans-serif"; ctx.textBaseline="middle";
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(6,H-30,W-12,26);
  items.forEach(it=>{ ctx.beginPath(); ctx.arc(x+7,y,6,0,7); ctx.fillStyle=it.c; ctx.fill();
    ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.fillText(it.label.replace(/^..\s/,""), x+18, y);
    x += ctx.measureText(it.label.replace(/^..\s/,"")).width + 42; });
}
/* ---------- the corn plant above ground ----------
   f = how far through the season (0..1), v = how well its root has fed it (0..1). A well-fed plant is
   tall and deep green with an ear; a starved one stays small and yellowish. It sways a little. */
function paintPlant(ctx,cx,gy,f,v,t){
  const grow=1-Math.pow(1-Math.max(0.04,Math.min(1,f)),2.2), vig=0.5+0.5*v;
  const hgt=gy*0.9*grow*vig;
  ctx.save(); ctx.translate(cx,gy); ctx.rotate(Math.sin(t/950)*0.022);
  const sw=Math.max(2.5, 9*grow*vig);
  const sg=ctx.createLinearGradient(-sw,0,sw,0);
  sg.addColorStop(0,"#2c7a2a"); sg.addColorStop(.45,"#72c455"); sg.addColorStop(1,"#276626");
  ctx.fillStyle=sg; ctx.beginPath(); ctx.moveTo(-sw,2); ctx.lineTo(-sw*0.4,-hgt); ctx.lineTo(sw*0.4,-hgt); ctx.lineTo(sw,2); ctx.closePath(); ctx.fill();
  const nLeaf=Math.min(12, Math.floor(2+grow*11));
  ctx.fillStyle="rgba(15,55,12,.5)";
  for(let i=1;i<=nLeaf;i++){ const y=-hgt*i/(nLeaf+1);                                   // nodes
    ctx.beginPath(); ctx.ellipse(0,y,sw*(1-0.5*i/nLeaf)*1.05,2.2,0,0,7); ctx.fill(); }
  for(let i=1;i<=nLeaf;i++){                                                              // leaves, alternating
    const y=-hgt*i/(nLeaf+1), dir=(i%2?1:-1);
    const age=Math.max(0,Math.min(1,(grow*(nLeaf+1)-i)/2.5+0.35));
    const len=hgt*0.62*(1-0.3*Math.abs(i/(nLeaf+1)-0.45))*age*vig;
    if(len>4) cornLeaf(ctx,0,y,dir,len,Math.max(3,len*0.17),v);
  }
  // day 40 is still vegetative (about V8-V10): no tassel, no ear yet - just the newest leaves
  // still rolled together at the top of the whorl
  const wl=Math.max(6,hgt*0.16);
  for(const d of [-1,1]){ ctx.fillStyle= v>0.55?"#7fd35e":"#b9d878";
    ctx.beginPath(); ctx.moveTo(0,-hgt); ctx.quadraticCurveTo(d*wl*0.35,-hgt-wl*0.75,d*wl*0.18,-hgt-wl);
    ctx.quadraticCurveTo(d*wl*0.05,-hgt-wl*0.5,0,-hgt); ctx.fill(); }
  ctx.restore();
}
function cornLeaf(ctx,x,y,dir,len,w,v){
  const rise=len*0.5, tipY=y-rise*0.35;                    // rises, then droops at the tip
  const c1x=x+dir*len*0.22, c1y=y-rise*0.95, c2x=x+dir*len*0.68, c2y=y-rise*1.0, ex=x+dir*len;
  const g=ctx.createLinearGradient(x,y,ex,tipY);
  const top = v>0.55 ? "#93e26c" : v>0.3 ? "#b5dc78" : "#d3d878";    // hungry plants go yellow
  const bot = v>0.55 ? "#2b8a2f" : v>0.3 ? "#5f9a48" : "#8a9a4a";
  g.addColorStop(0,top); g.addColorStop(1,bot); ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(x,y-w*0.5);
  ctx.bezierCurveTo(c1x,c1y-w*0.35,c2x,c2y-w*0.45,ex,tipY);
  ctx.bezierCurveTo(c2x+dir*3,c2y+w*0.85,c1x,c1y+w*1.15,x,y+w*0.55); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(255,255,225,.5)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.bezierCurveTo(c1x,c1y+w*0.3,c2x,c2y+w*0.2,ex,tipY); ctx.stroke();
}

function showResults(){
  cancelAnimationFrame(animId);          // stop the leftover-pulse loop
  const combo=comboCode(), g=grams(combo,curEnv), best=bestOf(curEnv);
  if(g===undefined || !best){ go("design"); return; }
  const score=Math.round(100*g/best);
  lastResult={combo, env:curEnv, score, g};
  const E=ENVS[curEnv];
  document.getElementById("resTitle").textContent=`${E.em} Your harvest in the ${E.name}:`;
  const tot = lastLeft ? (lastLeft.water+lastLeft.N+lastLeft.P) : 0;
  const leftLine = (lastLeft && tot===0) ? `<br><b style="color:#1e8449">Your root cleaned out the whole field — nothing left behind! 🏆</b>` : "";
  document.getElementById("gramLine").innerHTML=`Your corn plant grew to <b>${g.toFixed(1)} grams</b> — the best possible root made <b>${best.toFixed(1)} g</b>.<br>Root Score = your plant ÷ champion plant × 100${leftLine}`;
  document.getElementById("lessonBox").innerHTML=lessonText(combo,curEnv,score);
  go("results");
  // count-up (with guaranteed final value)
  const el=document.getElementById("scoreBig"); let v=0;
  const finalTxt=score+(score===100?" 🏆":" pts");
  const iv=setInterval(()=>{ v=Math.min(score,v+3); el.textContent=(v>=score)?finalTxt:String(v);
    if(v>=score) clearInterval(iv); },28);
  setTimeout(()=>{ clearInterval(iv); el.textContent=finalTxt; }, 1600);
}
function traitMeta(){ // build {code:{flip,name,emoji}} from CARDS
  const m={};
  CARDS.forEach(c=>{
    m[c.a.code]={flip:c.b.code, name:c.a.em+" "+c.a.label};
    m[c.b.code]={flip:c.a.code, name:c.b.em+" "+c.b.label};
  });
  return m;
}
function lessonText(combo,env,score){
  const M=traitMeta();
  const parts=combo.match(/../g);
  // compute each trait's effect, keep the ones that actually mattered
  const effects=parts.map((p,i)=>{
    const alt=parts.slice(); alt[i]=M[p].flip;
    return {p, d: grams(combo,env)-grams(alt.join(""),env)};
  }).filter(e=>Math.abs(e.d)>=0.4).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,4);
  const lines=effects.map(e=> e.d>0
    ? `${M[e.p].name}: <b style="color:#1e8449">great call! (+${e.d.toFixed(1)} g)</b>`
    : `${M[e.p].name}: <b style="color:#b03a2e">cost you ${(-e.d).toFixed(1)} g</b> — try ${M[M[e.p].flip].name}!`);
  const bc=bestComboOf(env);
  const head = score===100 ? "🏆 <b>PERFECT!</b> You found the champion root for this field!" :
    score>=90 ? "⭐ So close! A tiny tweak and you're champion:" :
    "Here's what mattered most:";
  const champNames = bc.match(/../g).map(c=>M[c].name.split(" ").slice(0,2).join(" ")).join(", ");
  const tail = score===100 ? "" : `<br><small>Champion root here: ${champNames}</small>`;
  return head+"<br>"+lines.join("<br>")+tail;
}

function artNested(key,x,y,s){ return WEATHER_ART[key].replace(/^<svg[^>]*>/, `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 100 100">`); }
function rootPath(kind,x){
  const tan="url(#gRoot)";
  const seg=(d,w,delay)=>`<path class="grow" d="${d}" stroke="${tan}" stroke-width="${w}" fill="none" filter="url(#fSoft)" `+
    `stroke-linecap="round"${delay?` style="animation-delay:${delay}s"`:""}/>`;
  let s="";
  if(kind==="deep"){
    // drawn in three tapering pieces so the root gets thinner as it goes down, like a real one
    s+=seg(`M${x} 72 C${x-5} 96 ${x+4} 112 ${x+1} 132`, 6);
    s+=seg(`M${x+1} 132 C${x-4} 152 ${x+5} 170 ${x+1} 190`, 4.2, 1.1);
    s+=seg(`M${x+1} 190 C${x-3} 208 ${x+3} 224 ${x} 240`, 2.6, 2.2);
    s+=seg(`M${x} 118 C${x-10} 122 ${x-18} 130 ${x-22} 140`, 2.4, 1.8);
    s+=seg(`M${x+2} 152 C${x+12} 156 ${x+19} 164 ${x+23} 174`, 2.4, 2.6);
    s+=seg(`M${x} 196 C${x-9} 200 ${x-15} 208 ${x-18} 218`, 2.0, 3.4);
  } else {
    s+=seg(`M${x} 72 C${x-4} 90 ${x+4} 104 ${x} 118`, 5.5);
    s+=seg(`M${x} 118 C${x-3} 124 ${x+2} 126 ${x} 130`, 3.2, 1.0);
    s+=seg(`M${x} 88 C${x-16} 92 ${x-30} 100 ${x-44} 104`, 2.8, 1.2);
    s+=seg(`M${x} 90 C${x+16} 94 ${x+30} 102 ${x+44} 106`, 2.8, 1.5);
    s+=seg(`M${x} 108 C${x-12} 112 ${x-24} 118 ${x-34} 122`, 2.4, 2.4);
    s+=seg(`M${x} 110 C${x+12} 114 ${x+24} 120 ${x+34} 124`, 2.4, 2.7);
    if(kind==="fuzzy"){
      for(let i=0;i<26;i++){ const t=i/25, px=x-44+88*t, py=104+Math.sin(t*6.28)*3+(t<.5?0:16)*Math.abs(Math.sin(t*3.14));
        const hx=px+(i%2?3:-3), hy=py+5;
        s+=`<line class="hair" x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${tan}" stroke-width="1.2" stroke-linecap="round"/>`; }
      for(let i=0;i<14;i++){ const t=i/13, py=76+52*t, px=x+Math.sin(t*9)*3;
        s+=`<line class="hair" x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${(px+(i%2?5:-5)).toFixed(1)}" y2="${(py+3).toFixed(1)}" stroke="${tan}" stroke-width="1.2" stroke-linecap="round"/>`; }
    }
  }
  return s;
}

function rooty(x,y,s,o={}){
  let g=`<g transform="translate(${x},${y}) scale(${s})">`;
  if(o.straw){
    g+=`<g transform="translate(84,72)"><path d="M0 -18 C10 -3 15 4 15 11 a15 13 0 0 1 -30 0 C-15 4 -10 -3 0 -18Z" fill="#54bdf5" stroke="#2b95d0" stroke-width="1.8"><animateTransform attributeName="transform" type="scale" values="1;1;0.4;0.4;1" keyTimes="0;0.12;0.62;0.78;1" dur="4.5s" repeatCount="indefinite"/></path><ellipse cx="-5" cy="-3" rx="2.6" ry="4.5" fill="#fff" opacity=".55"/></g>`;
    g+=`<circle cx="80" cy="66" r="1.6" fill="#d8f1ff"><animate attributeName="cy" values="70;52" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/></circle>`;
    g+=`<line x1="47" y1="50" x2="78" y2="64" stroke="#ff5b8a" stroke-width="3.4" stroke-linecap="round"/><line x1="47" y1="50" x2="78" y2="64" stroke="#fff" stroke-width="1.1" stroke-dasharray="3 3" opacity=".85"/>`;
  }
  g+=`<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1.2s" repeatCount="indefinite"/>`;
  if(o.wave) g+=`<path d="M52 44 C60 40 66 34 70 24" stroke="#e6d7b0" stroke-width="7" stroke-linecap="round" fill="none"><animateTransform attributeName="transform" type="rotate" values="0 52 44;-35 52 44;0 52 44" dur=".6s" repeatCount="indefinite"/></path>`;
  /* body shape: normal | fat | thin | fuzzy.  o.ids = suffix for gradient/filter ids when Rooty is
     drawn in an SVG that carries its own <defs> (the wheel screen), so a hidden copy can't steal them */
  const R=o.ids||"", shape=o.shape||"normal";
  const BODY={ normal:"M32 16 C50 16 56 30 54 48 C52 63 45 72 38 90 C31 72 24 63 22 48 C20 30 26 16 32 16Z",
               fat:   "M38 12 C64 12 72 32 68 54 C64 74 52 82 38 96 C24 82 12 74 8 54 C4 32 12 12 38 12Z",
               thin:  "M38 10 C47 10 49 30 48 50 C47 70 43 82 38 98 C33 82 29 70 28 50 C27 30 29 10 38 10Z" };
  const fx = shape==="fat" ? 1.38 : shape==="thin" ? 0.6 : 1;
  g+=`<path d="${BODY[shape==="fuzzy"?"normal":shape]}" fill="url(#gRoot${R})" stroke="#a88a52" stroke-width="1.8" filter="url(#fSoft${R})"/>`;
  if(shape==="fuzzy"){ let hs=`<g stroke="#e8d3a2" stroke-width="1.5" stroke-linecap="round">`;
    for(let i=0;i<30;i++){ const t=i/30, yy=22+t*64, sp=Math.sin(t*3.14)*16+2, sg=i%2?1:-1, xx=38+sg*sp;
      hs+=`<path d="M${xx.toFixed(1)} ${yy.toFixed(1)} l${sg*6} ${(2+(i%3)).toFixed(0)}"/>`; }
    g+=hs+`</g>`; }
  g+=`<g transform="translate(38,0) scale(${fx},1) translate(-38,0)">`;
  g+=`<g stroke="#b39a6a" stroke-width="1.3" stroke-linecap="round"><path d="M24 58l-7 3"/><path d="M52 60l7 4"/><path d="M28 70l-6 4"/><path d="M48 74l6 3"/><path d="M38 90v6"/></g>`;
  g+=`<ellipse cx="31" cy="36" rx="4.4" ry="4.8" fill="#fff"/><ellipse cx="44" cy="36" rx="4.4" ry="4.8" fill="#fff"/>`;
  const blink=`<animate attributeName="r" values="2.4;2.4;0.2;2.4;2.4" keyTimes="0;.88;.92;.96;1" dur="3.6s" repeatCount="indefinite"/>`;
  g+=`<circle cx="32" cy="37" r="2.4" fill="#2a1d0e">${blink}</circle><circle cx="45" cy="37" r="2.4" fill="#2a1d0e">${blink}</circle>`;
  const puff=o.straw?`<animate attributeName="r" values="3.2;4.6;3.2" dur="1.2s" repeatCount="indefinite"/>`:"";
  g+=`<circle cx="26" cy="46" r="3.2" fill="#ff9db0" opacity=".8">${puff}</circle><circle cx="50" cy="46" r="3.2" fill="#ff9db0" opacity=".8">${puff}</circle>`;
  if(o.straw) g+=`<ellipse cx="47" cy="50" rx="2.8" ry="2.2" fill="#7a3b2e"/>`;
  else if(o.munch) g+=`<ellipse cx="38" cy="51" rx="4.5" ry="2" fill="#7a3b2e"><animate attributeName="ry" values="1.2;4.5;1.2" dur=".55s" repeatCount="indefinite"/></ellipse>`;
  else g+=`<path d="M31 49 Q38 56 45 49" fill="none" stroke="#7a3b2e" stroke-width="2.2" stroke-linecap="round"/>`;
  return g+`</g></g></g>`;
}

/* a real corn plant: tapered stem, six arching shaded leaves */
function cornPlant(x,y,s,sway){
  const L=[[-1,56,-8],[1,62,-17],[-1,68,-26],[1,64,-35],[-1,52,-43],[1,42,-50]];
  let g=`<g transform="translate(${x},${y})">`;
  if(sway) g+=`<animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0 0 0;2.6 0 0;0 0 0;-2.6 0 0;0 0 0" dur="4.5s" repeatCount="indefinite"/>`;
  g+=`<g transform="scale(${s})" filter="url(#fSoft)">`;
  g+=`<ellipse cx="0" cy="0" rx="9" ry="3.4" fill="#3d2a17" opacity=".45"/>`;
  g+=`<path d="M-3.4 0 L-2 -54 L2 -54 L3.4 0 Z" fill="url(#gStem)"/>`;
  [-14,-28,-42].forEach(ny=>{ g+=`<path d="M-3 ${ny} h6" stroke="#2a6d28" stroke-width="1.4" opacity=".7"/>`; });
  L.forEach(([d,len,ly])=>{
    const tx=(d*len).toFixed(1), ty=ly+7;
    g+=`<path d="M0 ${ly} C${(d*len*0.32).toFixed(1)} ${ly-21} ${(d*len*0.74).toFixed(1)} ${ly-17} ${tx} ${ty}`+
       ` C${(d*len*0.7).toFixed(1)} ${ly-6} ${(d*len*0.3).toFixed(1)} ${ly+5} 0 ${ly+3} Z" fill="url(#gLeaf)"/>`;
    g+=`<path d="M0 ${ly} C${(d*len*0.4).toFixed(1)} ${ly-15} ${(d*len*0.75).toFixed(1)} ${ly-11} ${tx} ${ty}"`+
       ` stroke="#2c7a2a" stroke-width="1" fill="none" opacity=".45"/>`;
  });
  return g+`</g></g>`;
}

function xsec(cx,cy,r,airy){
  let g=`<g filter="url(#fSoft)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gRoot)" stroke="#8a5a2b" stroke-width="2.5"/>`;
  if(airy){ for(let i=0;i<7;i++){ const a=i*Math.PI*2/7;
      g+=`<circle cx="${(cx+Math.cos(a)*r*0.55).toFixed(1)}" cy="${(cy+Math.sin(a)*r*0.55).toFixed(1)}" r="${(r*0.21).toFixed(1)}" fill="#462c13"/>`; } }
  else { for(let ry=-2;ry<=2;ry++) for(let rx=-2;rx<=2;rx++){
      const x=cx+rx*r*0.36+(ry%2?r*0.18:0), y=cy+ry*r*0.36;
      if(Math.hypot(x-cx,y-cy)<r*0.78) g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r*0.15).toFixed(1)}" fill="#c58f47" stroke="#a9772f" stroke-width="1"/>`; } }
  return g+`<circle cx="${cx}" cy="${cy}" r="${(r*0.26).toFixed(1)}" fill="#fbecc8" stroke="#8a5a2b" stroke-width="1.6"/></g>`;
}

  }
  if(sc.type==="hairs"){
    s+=rootPath("deep",92)+cornPlant(92,70,0.85,true);

    s+=`<path d="M278 68 V236" stroke="url(#gRoot)" stroke-width="32" stroke-linecap="round"/>`;

    for(let i=0;i<28;i++){ const y=80+i*5.6, sg=(i%2)?1:-1;
      s+=`<line class="hair" x1="${278+sg*15}" y1="${y.toFixed(1)}" x2="${(278+sg*(33+(i%3)*8)).toFixed(1)}" y2="${(y+7).toFixed(1)}" stroke="#e0c288" stroke-width="2.4" stroke-linecap="round" style="animation-delay:${(0.5+i*0.07).toFixed(2)}s"/>`; }
    for(let i=0;i<7;i++){ const y=92+i*20, sg=(i%2)?1:-1;
      s+=dot(i%3===2?"N":"water", 278+sg*(48+(i%2)*8), y, "eat", 1.6+i*0.28); }
    s+=`</g>`;
    s+=`<circle cx="278" cy="152" r="76" fill="none" stroke="#fff" stroke-width="9"/>`;
    s+=`<circle cx="278" cy="152" r="69" fill="none" stroke="#cfe9f7" stroke-width="3" opacity=".9"/>`;
    s+=`<path d="M236 108 a76 76 0 0 1 34 -28" stroke="#fff" stroke-width="7" fill="none" opacity=".45" stroke-linecap="round"/>`;
    s+=label(278,234,172,"Thousands of tiny hairs",13);
    return s+`</svg>`;
  }
  if(sc.type==="tip"){
    s+=`<path class="grow" d="M200 72 C193 118 207 158 200 196" stroke="url(#gRoot)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#fSoft)"/>`;
    s+=`<path d="M185 194 q15 36 30 0 Z" fill="#cbae79"/>`;
    s+=`<ellipse cx="200" cy="198" rx="14" ry="9" fill="#fff" opacity=".3"/>`;
    for(let i=0;i<9;i++){ const sg=(i%2)?1:-1, y=120+i*13, r=2.6+rnd()*2.6;
      s+=`<circle cx="${(200+sg*20).toFixed(1)}" cy="${y}" r="${r.toFixed(1)}" fill="#6b4a2a">`+
         `<animate attributeName="cx" values="${(200+sg*14).toFixed(1)};${(200+sg*36).toFixed(1)}" dur="2.4s" begin="${(i*0.2).toFixed(2)}s" repeatCount="indefinite"/>`+
         `<animate attributeName="opacity" values=".95;.15" dur="2.4s" begin="${(i*0.2).toFixed(2)}s" repeatCount="indefinite"/></circle>`; }
    for(let i=0;i<3;i++) s+=`<text x="193" y="214" font-size="18" fill="#ffe14d" font-family="Arial" filter="url(#fGlow)">▼<animate attributeName="y" values="212;242" dur="1.8s" begin="${(i*0.6).toFixed(1)}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" begin="${(i*0.6).toFixed(1)}s" repeatCount="indefinite"/></text>`;
    s+=cornPlant(200,70,0.8,true);
    s+=label(92,152,150,"Only the TIP grows",13);
    s+=rooty(310,122,0.78,{});
    return s+`</svg>`;
  }
  if(sc.type==="cheap"){
    // same energy, two very different roots
    s+=label(200,6,168,"Same energy to spend!",13);
    s+=battery(72,26,3)+battery(258,26,3);
    s+=`<path class="grow" d="M110 72 C105 94 115 110 110 128" stroke="url(#gRoot)" stroke-width="24" fill="none" stroke-linecap="round" filter="url(#fSoft)"/>`;
    s+=xsec(44,212,21,false);
    s+=label(104,140,120,"THICK + SOLID",12);
    s+=label(104,166,120,"= a SHORT root",12);
    s+=rootPath("deep",292);
    s+=xsec(360,132,22,true);
    s+=label(292,196,124,"SKINNY + AIRY",12);
    s+=label(292,222,124,"= a LONG root!",12);
    s+=`<path d="M200 44 V238" stroke="#fff" stroke-width="2" stroke-dasharray="7 6" opacity=".5"/>`;
    s+=`<text x="292" y="120" font-size="22" class="sprk" style="transform-origin:292px 120px">✨</text>`;
    return s+`</svg>`;
  }
  if(sc.type==="sideroots"){
    s+=`<g filter="url(#fSoft)">`+artNested("Perfect",6,6,46)+artNested("Drought",348,6,46)+`</g>`;
    s+=label(102,60,150,"Food up top? BUSHY!",12);
    s+=label(298,60,150,"Dry year? Go DEEP",12);
    // left: a bushy root mopping up the topsoil
    s+=`<path class="grow" d="M102 72 C98 100 106 124 102 150" stroke="url(#gRoot)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#fSoft)"/>`;
    for(let i=0;i<10;i++){ const y=88+i*6.5, d=(i%2)?1:-1, len=16+(i%3)*10;
      s+=`<path class="grow" style="animation-delay:${(0.6+i*0.16).toFixed(2)}s" d="M102 ${y.toFixed(1)} q${(d*len*0.6).toFixed(1)} 4 ${(d*len).toFixed(1)} 11" stroke="url(#gRoot)" stroke-width="3" fill="none" stroke-linecap="round"/>`; }
    for(let i=0;i<7;i++) s+=dot(i%2?"N":"P", 42+rnd()*122, 92+rnd()*54, "eat", 1.4+i*0.3);
    // right: cracked dry topsoil, a lean root that spends its energy going down
    s+=`<g stroke="#4a3018" stroke-width="2.4" opacity=".8" fill="none" stroke-linecap="round">`+
       `<path d="M218 80 l6 14 l-5 12"/><path d="M262 78 l-5 16 l7 12"/><path d="M336 82 l6 13 l-6 13"/><path d="M380 78 l-5 15"/></g>`;
    s+=`<path class="grow" d="M298 72 C293 118 305 168 298 238" stroke="url(#gRoot)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#fSoft)"/>`;
    s+=`<path class="grow" style="animation-delay:2.2s" d="M299 176 q-12 6 -19 17" stroke="url(#gRoot)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    for(let i=0;i<5;i++) s+=dot("water", 236+rnd()*148, 186+rnd()*50, "eat", 2.4+i*0.3);
    s+=`<path d="M200 44 V238" stroke="#fff" stroke-width="2" stroke-dasharray="7 6" opacity=".5"/>`;
    return s+`</svg>`;
  }
  if(sc.type==="grow"){
    s+=rootPath("deep",200);
    s+=`<path id="upline" d="M200 232 C194 192 206 142 200 104 L200 52" fill="none" stroke="none"/>`;
    for(let i=0;i<6;i++){ const c=(i%2)?"#3fae63":"#54bdf5", b=(i*0.62).toFixed(2);
      s+=`<circle r="5.6" fill="${c}" stroke="#fff" stroke-width="1.4" filter="url(#fSoft)">`+
         `<animateMotion dur="3.6s" begin="${b}s" repeatCount="indefinite"><mpath xlink:href="#upline" href="#upline"/></animateMotion>`+
         `<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.8;1" dur="3.6s" begin="${b}s" repeatCount="indefinite"/></circle>`; }
    s+=`<g transform="translate(200,70)"><g><animateTransform attributeName="transform" type="scale" values="0.55;1.25" dur="6s" fill="freeze"/>`+
       cornPlant(0,0,1,false)+`</g></g>`;
    s+=`<text x="258" y="46" font-size="30" class="badge" style="transform-origin:258px 46px">🌽</text>`;
    s+=rooty(318,134,0.78,{});
    return s+`</svg>`;
  }
  if(sc.type==="go"){
    s+=rootPath("deep",316)+cornPlant(316,70,1.05,true)+rooty(88,82,1.4,{wave:true});
    s+=`<text x="232" y="152" font-size="34" class="badge" style="transform-origin:232px 152px">🚀</text><text x="252" y="106" font-size="30" class="badge" style="transform-origin:252px 106px;animation-delay:6.6s">🎡</text>`;
    return s+`</svg>`;
  }
  // "compare": two roots race for the same resource
  s+=depthLabels;
  const win=sc.plants[sc.winner];
  sc.dots.forEach(([type,y0,y1,n])=>{
    for(let i=0;i<n;i++){ const x=30+rnd()*340, y=y0+rnd()*(y1-y0);
      const reach = Math.abs(x-win.x) < (win.kind==="deep"?34:52) && (win.kind==="deep" ? y>110 : y<130);
      s+=dot(type,x,y,reach?'eat':'');
    }
  });
  sc.plants.forEach((p,i)=>{
    s+=rootPath(p.kind,p.x)+cornPlant(p.x,70,0.6,true);
    s+=label(p.x,4,100,p.label,12);
    const isWin=(i===sc.winner);
    s+=`<text class="badge" x="${p.x+50}" y="56" text-anchor="middle" font-size="26" style="transform-origin:${p.x+50}px 48px">${isWin?"🏆":"😢"}</text>`;
    if(isWin){ const ty=p.kind==="deep"?232:126;
      s+=`<text class="sprk" x="${p.x-22}" y="${ty}" font-size="18" style="transform-origin:${p.x-22}px ${ty}px">✨</text><text class="sprk" x="${p.x+10}" y="${ty-14}" font-size="18" style="transform-origin:${p.x+10}px ${ty-14}px">✨</text>`; }
  });
  return s+`</svg>`;
}
/* ================= narration =================
   Works offline. By default it uses a FEMALE voice already installed on the computer
   (Windows: Zira / Aria / Jenny; never a male voice). If real recordings are dropped into
   ra-data/voice/ as p01.mp3 ... p13.mp3 they are played instead — a real human teacher beats
   any built-in voice, and nothing else has to change. */
let narrVoice=null, narrSeq=0, narrAudio=null;
let voiceFiles=null;   // null = not checked yet, true = ra-data/voice/*.mp3 exist, false = use the built-in voice
const NARR_RATE=0.86, NARR_PITCH=1.06, NARR_GAP=430;   // slow, warm, a beat between sentences
function pickNarrator(){
  if(narrVoice) return narrVoice;
  let all=[]; try{ all=speechSynthesis.getVoices()||[]; }catch(e){ return null; }
  const en=all.filter(v=>/^en/i.test(v.lang||""));
  if(!en.length) return null;
  // best first: modern natural voices, then the classic Windows female voices
  const want=[/aria/i,/jenny/i,/michelle/i,/ana\b/i,/sonia/i,/libby/i,/natasha/i,/clara/i,
              /zira/i,/hazel/i,/heera/i,/susan/i,/samantha/i,/female/i,/google us english/i];
  for(const re of want){ const v=en.find(x=>re.test(x.name||"")); if(v){ narrVoice=v; return v; } }
  const male=/david|mark|ravi|george|james|guy|eric|daniel|alex|male/i;
  narrVoice = en.find(v=>!male.test(v.name||"")) || en[0];
  return narrVoice;
}
try{ if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{ narrVoice=null; pickNarrator(); }; }catch(e){}
function stopNarration(){
  narrSeq++;
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(narrAudio){ try{ narrAudio.pause(); }catch(e){} narrAudio=null; }
}
/* speak the sentences one at a time, pausing between them the way a teacher does */
function speakLines(lines, onDone){
  const mine=narrSeq;
  if(!window.speechSynthesis || !lines || !lines.length){ if(onDone) onDone(false); return; }
  let i=0;
  const next=()=>{
    if(mine!==narrSeq) return;                       // a new page took over
    if(i>=lines.length){ if(onDone) onDone(true); return; }
    let u; try{ u=new SpeechSynthesisUtterance(lines[i++]); }catch(e){ if(onDone) onDone(false); return; }
    const v=pickNarrator(); if(v) u.voice=v;
    u.rate=NARR_RATE; u.pitch=NARR_PITCH; u.volume=1;
    u.onend  =()=>{ if(mine===narrSeq) setTimeout(next, NARR_GAP); };
    u.onerror=()=>{ if(mine===narrSeq) setTimeout(next, NARR_GAP); };
    try{ speechSynthesis.speak(u); }catch(e){ if(onDone) onDone(false); }
  };
  next();
}
function narrateScene(sc, onDone){
  stopNarration();
  if(!introVoice){ if(onDone) onDone(false); return; }
  const mine=narrSeq;
  if(sc.id && voiceFiles!==false){   // a real recording wins if one has been supplied
    let a; try{ a=new Audio("ra-data/voice/"+sc.id+".mp3"); }catch(e){ a=null; }
    if(a){
      narrAudio=a;
      let fellBack=false;   // a missing file fires BOTH onerror and the play() rejection —
      const fallback=()=>{ if(fellBack) return; fellBack=true;   // without this guard it narrates twice
        voiceFiles=false;                                        // no recordings here — stop looking
        if(mine!==narrSeq) return; narrAudio=null; speakLines(sayOf(sc),onDone); };
      a.onended=()=>{ if(mine===narrSeq){ narrAudio=null; if(onDone) onDone(true); } };
      a.onplaying=()=>{ voiceFiles=true; };
      a.onerror=fallback;
      const p=a.play(); if(p&&p.catch) p.catch(fallback);
      return;
    }
  }
  speakLines(sayOf(sc), onDone);
}
/* roughly how long this page takes to read aloud — drives the progress bar */
function sceneDur(sc){
  const lines=sayOf(sc)||[];
  const words=lines.join(" ").split(/\s+/).filter(Boolean).length;
  return Math.max(6500, Math.min(22000, words*430 + lines.length*NARR_GAP + 1500));
}
/* the story plays as one continuous film: scenes cross-fade, the bar runs end to end,
   and when the last line is spoken it rolls straight into the game. */
let introLayerTop=false;
function showScene(sc){
  const host=document.getElementById("introScene");
  if(host.querySelectorAll(".layer").length!==2) host.innerHTML='<div class="layer"></div><div class="layer"></div>';
  const L=host.querySelectorAll(".layer");
  const cur=L[introLayerTop?1:0], nxt=L[introLayerTop?0:1];
  nxt.innerHTML=buildScene(sc);
  void nxt.offsetWidth;                       // restart the ken-burns drift
  nxt.classList.add("on"); cur.classList.remove("on");
  introLayerTop=!introLayerTop;
}
function introTotal(){ return PLAY.reduce((a,s)=>a+sceneDur(s),0); }
function introRender(){
  clearTimeout(introTimer); stopNarration();
  const sc=PLAY[introIdx];
  showScene(sc);
  const cap=document.getElementById("introCap");
  cap.style.animation="none"; void cap.offsetWidth; cap.style.animation=""; cap.textContent=capOf(sc);
  // one bar for the whole film, not one per page
  const total=introTotal(), dur=sceneDur(sc);
  let before=0; for(let i=0;i<introIdx;i++) before+=sceneDur(PLAY[i]);
  const f=document.getElementById("introFill");
  f.style.transition="none"; f.style.width=(100*before/total).toFixed(2)+"%";
  requestAnimationFrame(()=>{ f.style.transition=`width ${dur}ms linear`;
    f.style.width=(100*(before+dur)/total).toFixed(2)+"%"; });
  const at=introIdx;
  const advance=()=>{ if(introIdx!==at) return; if(sc.final) introEnd(); else introStep(1); };
  narrateScene(sc, spoke=>{ if(spoke && introIdx===at){ clearTimeout(introTimer);
    introTimer=setTimeout(advance, sc.final?1600:800); } });
  introTimer=setTimeout(advance, introVoice ? dur+6000 : dur);
}
function showIntro(full){
  introFull=!!full;
  PLAY = introFull ? INTRO : INTRO.filter(s=>s.short);
  if(!PLAY.length) PLAY=INTRO;
  INTRO.forEach(s=>{ s.final=false; });    // whichever page ends THIS cut is the one that
  PLAY[PLAY.length-1].final=true;          // rolls into the game
  introIdx=0; go("intro"); introRender();
}
function introStep(d){ const n=introIdx+d;
  if(n>=PLAY.length){ introEnd(); return; }
  introIdx=Math.max(0,n); introRender(); }
function introEnd(){ storySeen=true; clearTimeout(introTimer); stopNarration(); startRound(); }
function toggleVoice(){ introVoice=!introVoice; document.getElementById("introVoiceBtn").textContent=introVoice?"🔊 Voice":"🔇 Voice";
  if(!introVoice) stopNarration(); else introRender(); }

/* ================= init ================= */
drawWheel(); buildCards(); buildNameEntry();
document.getElementById("s_design").addEventListener("transitionend",()=>{});
const _origGo=go;
go=function(id){ _origGo(id);
  if(id!=="intro"){ clearTimeout(introTimer); stopNarration(); }
  if(id==="design"){ const E=ENVS[curEnv];
    document.getElementById("designTitle").innerHTML=`${E.em} ${E.name} — build your root!`;
    document.getElementById("hintLine").textContent=E.hint; }
  if(id==="name") buildNameEntry();
};
</script>
